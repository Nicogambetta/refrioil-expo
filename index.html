<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e0e0f">
<title>Refrioil · Espuma de Limpieza HVAC-R</title>
<meta name="description" content="Conocé la Espuma de Limpieza HVAC-R Refrioil, resolvé el desafío y acercate al stand 145A de Expo Frío Calor 2026 para participar del sorteo presencial.">
<style>
:root{--negro:#0e0e0f;--gris-oscuro:#1c1c1f;--gris:#2c2c31;--gris-claro:#9a9aa1;--rojo:#e30613;--rojo-oscuro:#b8000f;--verde:#1fbf75;--foto:#d4d4d6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark;overflow-x:hidden}
body{margin:0;background:var(--negro);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.25;min-height:100svh;display:flex;flex-direction:column;overscroll-behavior-y:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button:focus-visible,a:focus-visible{outline:3px solid #ffbe47;outline-offset:4px}
img{display:block;max-width:100%;user-select:none;-webkit-user-drag:none;pointer-events:none}
[hidden]{display:none!important}

/* barra */
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 18px 10px}
.brand{display:flex;align-items:center}
.logo{height:30px;width:auto}
.home{display:flex;align-items:center;gap:6px;background:var(--gris-oscuro);border:1px solid var(--gris);border-radius:30px;padding:10px 16px;font-size:15px;font-weight:700;min-height:44px}

/* pantallas */
main{flex:1;display:flex;flex-direction:column;width:100%;max-width:560px;margin:0 auto;padding:6px 18px calc(22px + env(safe-area-inset-bottom))}
.screen{display:flex;flex-direction:column;gap:14px;flex:1;animation:entrar .35s ease both}
@keyframes entrar{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
h1{font-size:clamp(30px,8.5vw,44px);line-height:1.02;letter-spacing:-1px;margin:0;font-weight:900}
h2{font-size:clamp(24px,6.8vw,34px);line-height:1.08;letter-spacing:-.5px;margin:0;font-weight:900}
h1 em,h2 em{font-style:normal;color:var(--rojo)}
p{margin:0;font-size:17px;color:#d6d6db}
.muted{color:var(--gris-claro);font-size:14px;text-align:center}
.center{text-align:center}
.spacer{flex:1}
.paso{color:var(--gris-claro);font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.explicacion{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:10px}
.explicacion .foto{height:clamp(170px,30svh,260px)}
.stage3d{position:relative;height:clamp(290px,48svh,470px);border:1px solid #333944;border-radius:22px;background:radial-gradient(ellipse at 50% 38%,#303846,#101216 72%);overflow:hidden;touch-action:pan-y;cursor:grab}
.stage3d canvas{display:block;width:100%;height:100%}
.stage3d:active{cursor:grabbing}
.stage3d.sim{height:clamp(280px,42svh,420px);cursor:default}
.stage3d .error3d{position:absolute;inset:0;display:flex;align-items:center;padding:28px;background:#15181eee;text-align:center}
.controls3d{display:grid;grid-template-columns:1fr 2fr 1fr;gap:8px}
.controls3d button,.scene-pick button,.video-btn{background:var(--gris-oscuro);border:1px solid #414550;border-radius:12px;min-height:48px;font-size:16px;font-weight:700;padding:10px}
.scene-pick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.scene-pick button{font-size:14px;overflow-wrap:anywhere}
.scene-pick button[aria-pressed="true"]{background:#fff;color:#15171a;border-color:#fff}
.scene-status{font-size:17px;font-weight:750;text-align:center;min-height:22px}
.scrub{width:100%;min-height:44px;accent-color:var(--rojo);margin:0;touch-action:pan-y}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.demo-actions{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.demo-actions .btn{min-height:52px;font-size:17px;padding:10px}
.video-btn:disabled{opacity:.5;cursor:wait}
.download-video{color:#fff;text-align:center;font-weight:700;padding:15px;border:1px solid var(--verde);border-radius:12px}
.demo-video{display:block;width:100%;aspect-ratio:1;background:#11151b;border-radius:18px;border:1px solid #333944;object-fit:contain}
details.precauciones{font-size:14px;color:var(--gris-claro)}
details.precauciones summary{cursor:pointer;min-height:44px;display:flex;align-items:center;justify-content:center}
details.precauciones p{font-size:14px;line-height:1.45;padding:0 8px 8px}

/* botones */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:62px;padding:14px 20px;border-radius:16px;font-size:20px;font-weight:800;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn-red{background:var(--rojo);color:#fff;box-shadow:0 8px 24px rgba(227,6,19,.35)}
.btn-red:active{background:var(--rojo-oscuro)}
.btn-ghost{background:var(--gris-oscuro);border:1px solid var(--gris)}

/* fotos */
.foto{position:relative;background:var(--foto);border-radius:22px;overflow:hidden}
.foto img{width:100%;height:100%;object-fit:contain}
.chip{position:absolute;top:12px;left:12px;background:rgba(255,255,255,.92);color:#333;font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:7px 11px;border-radius:30px}
.hero{height:clamp(260px,52svh,520px)}
.expo{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;color:#d6d6db;line-height:1.4}
.expo strong{background:var(--rojo);padding:8px 12px;border-radius:10px;color:white;white-space:nowrap}
.participacion{padding:22px;border:1px solid #e30613;border-radius:20px;background:#251215;display:flex;flex-direction:column;gap:12px;text-align:center}
.participacion strong{font-size:32px;color:#fff}
.participacion p{line-height:1.45}
.screen[data-pantalla="inicio"] .hero{height:clamp(210px,35svh,350px)}
.hero.con-video{height:auto!important;aspect-ratio:16/9;background:#171719}
.hero.con-video video{display:block;width:100%;height:100%;object-fit:contain}
.hero .video-control{position:absolute;right:10px;bottom:10px;min-height:44px;padding:8px 14px;border-radius:12px;background:#111e;color:#fff;font-size:14px;font-weight:700}
.hero .video-nota{position:absolute;top:10px;left:10px;padding:6px 9px;background:#111e;border-radius:8px;font-size:12px;color:#fff}

/* visor frente / dorso / 360 */
.viewer{height:clamp(280px,54svh,560px);touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none;perspective:1600px;background:var(--negro);overflow:visible}
.viewer:active{cursor:grabbing}
.card3d{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.card3d.drag{transition:none}
.card3d figure{position:absolute;inset:0;margin:0;background:var(--foto);border-radius:22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.card3d figure.blanco{background:#fff}
.card3d figure.dorso{transform:rotateY(180deg)}
.dots{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:8px}
.dots i{width:10px;height:10px;border-radius:50%;background:rgba(0,0,0,.25);transition:.2s}
.dots i.on{background:var(--rojo);transform:scale(1.25)}
.giro{position:absolute;inset:0;display:none}
.giro.on{display:block}
.segment{display:grid;grid-auto-flow:column;gap:6px;background:var(--gris-oscuro);border:1px solid var(--gris);border-radius:16px;padding:5px}
.segment button{min-height:50px;border-radius:12px;font-size:17px;font-weight:800;color:var(--gris-claro)}
.segment button[aria-pressed="true"]{background:#fff;color:var(--negro)}

/* desafío */
.serp{height:clamp(170px,30svh,300px);background:#fff}
.opciones{display:flex;flex-direction:column;gap:10px}
.opcion{position:relative;display:flex;align-items:center;gap:14px;width:100%;min-height:92px;padding:8px 14px 8px 8px;background:var(--gris-oscuro);border:2px solid var(--gris);border-radius:18px;text-align:left;transition:border-color .2s,background .2s,transform .1s}
.opcion:active{transform:scale(.98)}
.opcion .img{width:76px;height:76px;border-radius:12px;background:#fff;overflow:hidden;flex:none}
.opcion .img img{width:100%;height:100%;object-fit:contain}
.opcion b{flex:1;font-size:21px;line-height:1.1}
.opcion small{display:block;color:var(--gris-claro);font-size:11px;letter-spacing:1px;text-transform:uppercase;font-weight:700;margin-top:4px}
.opcion .mark{width:34px;height:34px;border-radius:50%;flex:none;display:none;align-items:center;justify-content:center;font-weight:900;font-size:20px}
.opcion.ok{border-color:var(--verde);background:#123626;animation:latir .5s}
.opcion.ok .mark{display:flex;background:var(--verde);color:#062}
.opcion.bad{border-color:var(--rojo);background:#3a1418;animation:sacudir .4s}
.opcion.bad .mark{display:flex;background:var(--rojo);color:#fff}
.opcion:disabled{opacity:.45}
.opcion.ok:disabled{opacity:1}
@keyframes sacudir{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes latir{50%{transform:scale(1.04)}}
.toast{background:#3a1418;border:1px solid var(--rojo);border-radius:16px;padding:14px 18px;font-size:19px;font-weight:800;text-align:center;animation:entrar .25s ease both}
.ronda-meta{display:flex;justify-content:space-between;align-items:center;gap:12px;color:#d6d6db;font-size:14px;font-weight:700}
.ronda-pasos{display:flex;gap:7px}
.ronda-pasos i{width:30px;height:5px;border-radius:4px;background:#45454d}
.ronda-pasos i.actual{background:#fff}.ronda-pasos i.acierto{background:var(--verde)}.ronda-pasos i.error{background:var(--rojo)}
.orden-taller{padding:18px;border-left:4px solid var(--rojo);border-radius:0 16px 16px 0;background:#202024;display:grid;gap:8px}
.orden-taller .etiqueta{font-size:14px;font-weight:750;color:#b6b6bf}
.orden-taller p{font-size:18px;line-height:1.4;color:#fff}
.catalogo-opciones{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.producto-opcion{display:flex;flex-direction:column;position:relative;border:2px solid #38383f;border-radius:17px;background:#1c1c1f;overflow:hidden;text-align:left;min-width:0;transition:border-color .15s}
.producto-opcion img{width:100%;height:clamp(108px,17svh,158px);object-fit:contain;background:#e4e5e3}
.producto-opcion .nombre{padding:11px 12px;font-size:16px;font-weight:800;line-height:1.2}
.producto-opcion .aplicacion{display:block;margin-top:6px;color:#c7c7cf;font-size:14px;font-weight:500;line-height:1.3}
.producto-opcion .marca{position:absolute;right:8px;top:8px;width:27px;height:27px;border-radius:50%;background:#101014;color:white;display:grid;place-items:center;font-weight:800;border:1px solid #777}
.producto-opcion[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 1px #fff}
.producto-opcion[aria-pressed="true"] .marca{background:#fff;color:#171719}
.producto-opcion.correcta{border-color:var(--verde)}.producto-opcion.correcta .marca{background:var(--verde);color:#072a1b}
.producto-opcion.incorrecta{border-color:#ff6671}.producto-opcion.incorrecta .marca{background:#ae1020;color:white}
.producto-opcion:disabled{cursor:default}
.resolver:disabled{background:#29292e;color:#aaa;box-shadow:none;cursor:default}
.devolucion{display:grid;gap:8px;border:1px solid #555;border-radius:16px;padding:16px;background:#222227}
.devolucion.ok{border-color:var(--verde);background:#102c21}.devolucion p{font-size:16px;line-height:1.4}
.devolucion a,.fuentes a{color:#ededf1;text-decoration:underline;font-size:14px}
.puntaje{font-size:clamp(66px,19vw,108px);font-weight:900;line-height:1;text-align:center;letter-spacing:-5px}
.resumen-casos{display:grid;gap:8px;padding:0;list-style:none;margin:0}.resumen-casos li{padding:14px;background:#202024;border-radius:12px;font-size:16px;line-height:1.4}
.fuentes{color:#b6b6bf;font-size:14px}.fuentes summary{cursor:pointer;padding:14px 0}.fuentes ul{padding-left:20px;line-height:1.7}

/* final */
.check{width:96px;height:96px;border-radius:50%;background:var(--verde);display:flex;align-items:center;justify-content:center;margin:4px auto 0;box-shadow:0 12px 40px rgba(31,191,117,.35);animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
.check svg{width:52px;height:52px;fill:none;stroke:#04261a;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.final-foto{height:clamp(180px,30svh,320px)}
.tags{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.tag{background:var(--gris-oscuro);border:1px solid var(--gris);border-radius:30px;padding:9px 15px;font-size:15px;font-weight:700}
.contacto{display:flex;flex-direction:column;gap:10px}
.contacto h3{margin:4px 0 0;text-align:center;font-size:20px;font-weight:900}
.btn-wa{background:#25d366;color:#062b16;box-shadow:0 8px 24px rgba(37,211,102,.3);text-decoration:none}
.btn-wa svg{width:28px;height:28px;fill:currentColor}
.redes{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px}
.redes a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:72px;padding:10px 6px;background:var(--gris-oscuro);border:1px solid var(--gris);border-radius:14px;color:#fff;text-decoration:none;font-size:13px;font-weight:700}
.redes a:active{transform:scale(.96)}
.redes svg{width:26px;height:26px;fill:currentColor}
#confeti{position:fixed;inset:0;pointer-events:none;z-index:9}

/* selector (solo con 2+ productos disponibles) */
.productos{display:grid;gap:8px}
.productos button{background:var(--gris-oscuro);border:1px solid var(--gris);border-radius:14px;padding:12px 14px;min-height:56px;font-size:17px;font-weight:700;text-align:left}
.productos button[aria-current="true"]{border-color:var(--rojo)}

footer{padding:10px 18px calc(12px + env(safe-area-inset-bottom));color:#5f5f66;font-size:12px;text-align:center}

@media(max-width:360px),(max-height:640px){
  .btn{min-height:56px;font-size:18px}
  .opcion{min-height:80px}.opcion .img{width:64px;height:64px}.opcion b{font-size:18px}
  .hero{height:clamp(200px,42svh,320px)}.viewer{height:clamp(220px,44svh,380px)}.serp{height:clamp(140px,24svh,220px)}
}
</style>
</head>
<body>

<header class="top">
  <button class="brand" id="btnLogo" type="button" aria-label="Refrioil, volver al inicio"><img class="logo" src="logo-blanco.png" alt="Refrioil Lubricantes"></button>
  <button class="home" id="btnHome" type="button" hidden>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>
    Inicio
  </button>
</header>

<main id="app" aria-live="polite"></main>
<canvas id="confeti" hidden></canvas>

<footer>Refrioil · Espuma de Limpieza HVAC-R</footer>

<script>
/* =====================================================================
   PRODUCTOS — para sumar uno: copiar el bloque "espuma", completar y
   poner disponible:true. Con 2+ disponibles el inicio muestra un selector.
   Abrir uno directo: index.html?producto=ID

   GIRO 360° — cuando haya fotos del envase desde varios ángulos, guardarlas
   como 360/espuma-01.jpg, 360/espuma-02.jpg, … (mínimo 8, girando siempre
   para el mismo lado) y cargar las rutas en giro360. El botón "360°"
   aparece solo si la lista tiene fotos.
   ===================================================================== */
const PRODUCTOS = [
  {
    id: 'espuma', disponible: true,
    nombre: 'Espuma de Limpieza', linea: 'HVAC-R',
    videoPortada: 'videos/refrioil-angulos-v2.mp4',
    posterPortada: 'videos/angulos-v2-poster.jpg',
    videoAplicacion: 'videos/refrioil-split-espuma-blanca-v3.mp4',
    posterAplicacion: 'videos/split-espuma-blanca-v3-poster.jpg',
    fotos: {
      frente: { src: 'producto-web.jpg', alt: 'Frente del envase de Espuma de Limpieza HVAC-R Refrioil' },
      dorso:  { src: 'dorso-web.jpg',    alt: 'Dorso del envase de Espuma de Limpieza HVAC-R Refrioil', fondo: 'blanco' }
    },
    giro360: [],
    usos: ['Serpentinas', 'Motores', 'Radiadores'],          // tal cual la etiqueta
    desafio: {
      imagen: { src: 'serpentina-web.jpg', alt: 'Ilustración de una serpentina' },
      pregunta: 'Vas a limpiar una <em>serpentina</em>.<br>¿Qué producto elegís?',
      opciones: [
        { texto: 'Espuma de limpieza',    img: 'producto-web.jpg',     foto: true, correcta: true },
        { texto: 'Aceite para compresor', img: 'aceite-web.jpg' },
        { texto: 'Refrigerante',          img: 'refrigerante-web.jpg' }
      ],
      correcto: '¡Correcto! Esta espuma está indicada para limpiar serpentinas.',
      incorrecto: ['Ese no. ¡Probá otro!', 'Casi… ¡otra vez!']
    }
  },
  // ---- Próximos productos: completar y poner disponible:true ----
  { id: 'limpiador-bomba', disponible: false, nombre: 'Limpiador de Bomba', linea: 'HVAC-R', fotos: { frente: {}, dorso: {} }, giro360: [], usos: [], desafio: null },
  { id: 'long',            disponible: false, nombre: 'Long',               linea: 'HVAC-R', fotos: { frente: {}, dorso: {} }, giro360: [], usos: [], desafio: null }
];

/* Desafío de selección de productos: no sustituye fichas ni diagnóstico técnico.
   Fotos y funciones verificadas en el catálogo oficial; ver productos/FUENTES.md. */
const CATALOGO = {
  espuma: {nombre:'Espuma HVAC-R', img:'producto-web.jpg', uso:'Limpiar serpentinas', fuente:null},
  clean: {nombre:'Clean Air', img:'productos/clean-air.jpg', uso:'Limpiar filtros de aire', fuente:'https://refrioil.com/clean-air-limpiador-desengrasante/'},
  detector: {nombre:'Detector de Fugas Exterior', img:'productos/detector-exterior.jpg', uso:'Localizar fugas por burbujas', fuente:'https://refrioil.com/detector-de-fugas-exterior/'},
  sellador: {nombre:'Sellalong 10', img:'productos/sellalong-10.jpg', uso:'Sellar virolas y pestañas', fuente:'https://refrioil.com/sellador-hvac-r-10/'}
};
const CASOS = [
  {id:'e-aletas',tipo:'elegir',lugar:'Split interior',titulo:'Elegí el producto.',situacion:'Los filtros ya están limpios. Ahora toca retirar suciedad de las aletas del evaporador con espuma en aerosol.',correctas:['espuma'],detalle:'El trabajo es sobre la serpentina, no sobre los filtros. La Espuma HVAC-R está indicada para esa limpieza.'},
  {id:'e-filtro',tipo:'elegir',lugar:'Mantenimiento de aire acondicionado',titulo:'Leé bien la orden.',situacion:'La serpentina no necesita limpieza. El trabajo de hoy es quitar la suciedad de los filtros de aire.',correctas:['clean'],detalle:'Clean Air es el producto del catálogo destinado a limpiar los filtros. La tarea no es limpiar la serpentina.'},
  {id:'e-union',tipo:'elegir',lugar:'Control de una unión',titulo:'¿Qué llevás al equipo?',situacion:'Hay que localizar una pérdida por fuera de una unión, buscando una indicación con burbujas. No sellarla.',correctas:['detector'],detalle:'El Detector de Fugas Exterior ayuda a localizar escapes por burbujas. Detectar y sellar son tareas distintas.'},
  {id:'e-virola',tipo:'elegir',lugar:'Armado de conexiones',titulo:'Elegí con precisión.',situacion:'La orden pide un sellador específico para virolas y pestañas de refrigeración; no un líquido para buscar pérdidas.',correctas:['sellador'],detalle:'Sellalong 10 es el sellador para virolas y pestañas del catálogo. Un detector no cumple esa función.'},
  {id:'k-split',tipo:'kit',lugar:'Dos tareas independientes',titulo:'Armá el kit.',situacion:'Limpiar los filtros del split y retirar suciedad de la serpentina con espuma en aerosol.',correctas:['clean','espuma'],detalle:'Clean Air corresponde a los filtros; la Espuma HVAC-R, a la serpentina. Son tareas separadas: no mezcles los productos.'},

const app = document.getElementById('app'), btnHome = document.getElementById('btnHome');
const ORDEN = ['inicio', 'producto', 'fotos', 'aprender', 'uso', 'simulacion', 'desafio', 'resultado', 'final'];
let desafioCompletado = false;
let partida = null;
let ultimosCasos = [];
try { ultimosCasos = JSON.parse(sessionStorage.getItem('refrioil-casos-v2') || '[]'); if(!Array.isArray(ultimosCasos)) ultimosCasos=[]; } catch (_) {}
function nuevaPartida() {
  const casos = ['elegir','kit','error'].map(tipo => {
    const banco=CASOS.filter(c=>c.tipo===tipo), nuevos=banco.filter(c=>!ultimosCasos.includes(c.id));
    return mezclar(nuevos.length ? nuevos : banco)[0];
  });
  ultimosCasos=casos.map(c=>c.id);
  try { sessionStorage.setItem('refrioil-casos-v2',JSON.stringify(ultimosCasos)); } catch (_) {}
  partida={casos,indice:0,respuestas:[]}; desafioCompletado=false;
}
let transicion = null;
let limpiarEscena = () => {};
let producto = elegirProducto();

function elegirProducto() {
  const id = new URLSearchParams(location.search).get('producto');
  const lista = PRODUCTOS.filter(p => p.disponible);
  return lista.find(p => p.id === id) || lista[0];
}
function ir(nombre) {
  if (nombre === 'simulacion') nombre = 'aprender';
  if (nombre === 'final' && !desafioCompletado) nombre = 'desafio';
  if (nombre === 'resultado' && (!partida || partida.respuestas.length !== 3)) nombre = 'desafio';
  if (nombre === 'desafio' && (!partida || partida.indice >= 3)) nuevaPartida();
  if (nombre === 'inicio') { partida=null; desafioCompletado=false; }
  limpiarEscena(); limpiarEscena = () => {};
  clearTimeout(transicion); transicion = null;
  app.innerHTML = '';
  const s = document.createElement('section'); s.className = 'screen'; s.dataset.pantalla = nombre;
  const paso = {producto:'1 · Conocé',aprender:'2 · Descubrí',uso:'Demo conceptual',desafio:'3 · Desafío'}[nombre];
  if (paso) s.appendChild(el(`<p class="paso">${paso}</p>`));
  app.appendChild(s); PANTALLAS[nombre](s);
  btnHome.hidden = nombre === 'inicio';
  window.scrollTo({ top: 0 });
  const titulo = s.querySelector('h1,h2');
  if (titulo) { titulo.tabIndex = -1; titulo.focus({preventScroll:true}); }
}

const mezclar = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const reducirMovimiento = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const vibrar = p => { if (!reducirMovimiento() && navigator.vibrate) navigator.vibrate(p); };

    const picker=el('<div class="scene-pick" role="group" aria-label="Escenario ilustrativo"><button type="button" data-scene="interior" aria-pressed="true">Serpentina interior</button><button type="button" data-scene="condensador" aria-pressed="false">Condensador</button><button type="button" data-scene="radiador" aria-pressed="false">Radiador</button></div>');
    const host=el('<div class="stage3d sim" role="img" aria-label="Simulación 3D de espuma sobre una superficie de intercambio térmico"></div>');
    const status=el('<p class="scene-status" role="status">Elegí un escenario y reproducí</p>');
    const range=el('<input class="scrub" type="range" min="0" max="100" value="0" step="1" aria-label="Avance de la animación, no representa un tiempo de aplicación">');
    const actions=el('<div class="demo-actions"><button type="button" class="btn btn-red">Reproducir</button><button type="button" class="btn btn-ghost">Reiniciar</button></div>');
    const exportar=el('<button type="button" class="video-btn">Guardar un clip para el stand</button>');
    const download=el('<a class="download-video" hidden></a>');
    s.append(picker,host,status,range,actions,el('<p class="muted">Simulación ilustrativa. No es una prueba del producto.</p>'),exportar,download,
      el('<details class="precauciones"><summary>Antes de usar el producto</summary><p>Uso industrial. Consultá instrucciones, precauciones y compatibilidades en la etiqueta y ficha técnica. Esta animación no indica dosis, tiempos de acción, pasos de aplicación ni resultados garantizados.</p></details>'));
    const next = el('<button class="btn btn-red" type="button">Probar el desafío</button>');
    next.onclick = () => ir('desafio');
    s.append(el('<div class="spacer"></div>'), next);
    const buttons=actions.querySelectorAll('button');let videoURL=null;
    host.addEventListener('sceneerror',e=>error3d(host,e.detail));
    try {
      if(!window.Refrioil3D)throw new Error('No se cargó la animación. Podés continuar con el desafío.');
      const sim=window.Refrioil3D.simulation(host,({progress,playing,recording,reduced})=>{
        range.value=String(Math.round(progress*100));range.disabled=recording;
        const label=recording?'Preparando el clip…':progress<=0?'Superficie de referencia':progress<1?'La espuma recubre la superficie':'Cobertura de espuma · vista ilustrativa';
        if(status.textContent!==label)status.textContent=label;
        buttons[0].textContent=reduced?'Cambiar vista':playing?'Pausar':progress>=1?'Repetir':'Reproducir';
        buttons.forEach(b=>b.disabled=recording);picker.querySelectorAll('button').forEach(b=>b.disabled=recording);exportar.disabled=recording;
        exportar.textContent=recording?'Grabando… mantené esta pestaña visible':'Guardar un clip para el stand';
      });
      picker.querySelectorAll('button').forEach(b=>b.onclick=()=>{sim.select(b.dataset.scene);picker.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));download.hidden=true;});
      range.oninput=()=>sim.setProgress(Number(range.value)/100);buttons[0].onclick=()=>sim.toggle();buttons[1].onclick=()=>sim.reset();
      exportar.onclick=()=>{try{download.hidden=true;sim.record(({blob,extension,kind})=>{if(videoURL)URL.revokeObjectURL(videoURL);videoURL=URL.createObjectURL(blob);download.href=videoURL;download.download=`refrioil-${kind}-demo.${extension}`;download.textContent=`Descargar video ${extension.toUpperCase()}`;download.hidden=false;});}catch(e){status.textContent=e.message;}};
      limpiarEscena=()=>{sim.dispose();if(videoURL)URL.revokeObjectURL(videoURL);};
    } catch(e) {error3d(host,e);picker.hidden=true;range.hidden=true;actions.hidden=true;exportar.hidden=true;status.textContent='La espuma está indicada para limpiar serpentinas. Consultá las instrucciones del envase.';}
  },

  desafio(s) {
    const ronda=partida, d=ronda.casos[ronda.indice], cantidad=d.correctas.length;
    const seleccion=new Set(); let resuelto=false;
    s.dataset.caso=d.id;
    const nombreModo={elegir:'Elegí',kit:'Armá el kit',error:'Detectá el error'};
    s.append(
      el(`<div class="ronda-meta"><span>Caso ${ronda.indice+1} de 3 · ${nombreModo[d.tipo]}</span><span class="ronda-pasos" aria-hidden="true">${[0,1,2].map(i=>`<i class="${i===ronda.indice?'actual':ronda.respuestas[i] ? ronda.respuestas[i].acierto?'acierto':'error':''}"></i>`).join('')}</span></div>`),
      el(`<h2>${esc(d.titulo)}</h2>`),
      el(`<div class="orden-taller"><span class="etiqueta">${esc(d.lugar)}</span><p>${esc(d.situacion)}</p></div>`),
      el(`<p class="muted" id="instruccion-ronda">${cantidad===2?'Elegí 2 productos. Se usan por separado.':'Elegí 1 opción.'} Tenés un intento por caso.</p>`)
    );
    const lista=el('<div class="catalogo-opciones" role="group" aria-labelledby="instruccion-ronda"></div>');
    const confirmar=el(`<button class="btn btn-red resolver" type="button" disabled>${cantidad===2?'Elegí 2 productos':'Elegí una opción'}</button>`);
    const fb=el('<div></div>');
    mezclar(Object.keys(CATALOGO)).forEach(id=>{
      const p=CATALOGO[id];
      const b=el(`<button class="producto-opcion" type="button" data-producto="${id}" aria-pressed="false"><img src="${p.img}" alt="" width="158" height="158"><span class="marca" aria-hidden="true"></span><span class="nombre">${esc(p.nombre)}${d.asignaciones?`<span class="aplicacion">${esc(d.asignaciones[id])}</span>`:''}</span></button>`);
      b.onclick=()=>{
        if(resuelto) return;
        if(seleccion.has(id)) seleccion.delete(id);
        else { if(cantidad===1) seleccion.clear(); if(seleccion.size<cantidad) seleccion.add(id); }
        lista.querySelectorAll('button').forEach(x=>{const on=seleccion.has(x.dataset.producto);x.setAttribute('aria-pressed',String(on));x.querySelector('.marca').textContent=on?'✓':'';});
        confirmar.disabled=seleccion.size!==cantidad;
        confirmar.textContent=seleccion.size===cantidad?'Confirmar respuesta':cantidad===2?`Elegí ${cantidad-seleccion.size} producto${cantidad-seleccion.size===1?'':'s'}`:'Elegí una opción';
      };
      lista.appendChild(b);
    });
    confirmar.onclick=()=>{
      if(resuelto || seleccion.size!==cantidad || partida!==ronda) return;
      resuelto=true;
      const acierto=d.correctas.every(id=>seleccion.has(id));
      ronda.respuestas.push({id:d.id,acierto,seleccion:[...seleccion]});
      lista.querySelectorAll('button').forEach(b=>{
        b.disabled=true;
        const id=b.dataset.producto;
        if(d.correctas.includes(id)){b.classList.add('correcta');b.querySelector('.marca').textContent='✓';}
        else if(seleccion.has(id)){b.classList.add('incorrecta');b.querySelector('.marca').textContent='✕';}
      });
      confirmar.hidden=true; vibrar(acierto?60:[30,40,30]);
      fb.append(el(`<div class="devolucion ${acierto?'ok':''}" role="status" tabindex="-1"><strong>${acierto?'Bien resuelto.':'Esta vez no.'}</strong><p>${esc(d.detalle)}</p><p>Respuesta: ${d.correctas.map(id=>esc(CATALOGO[id].nombre)).join(' + ')}.</p></div>`));
      const siguiente=el(`<button class="btn btn-red" type="button">${ronda.indice===2?'Ver resultado':'Siguiente caso'}</button>`);
      siguiente.onclick=()=>{
        if(partida!==ronda) return;
        ronda.indice++;
        if(ronda.indice<3) ir('desafio');
        else {desafioCompletado=ronda.respuestas.every(r=>r.acierto);if(desafioCompletado){confeti();ir('final');}else ir('resultado');}
      };
      s.append(siguiente);fb.querySelector('.devolucion').focus({preventScroll:true});
      fb.scrollIntoView?.({block:'nearest',behavior:reducirMovimiento()?'instant':'smooth'});
    };
    s.append(lista,confirmar,fb,el('<p class="muted">3 aciertos para completar el desafío. Sin reloj.</p>'));
  },

  resultado(s) {
    const aciertos=partida.respuestas.filter(r=>r.acierto).length;
    s.append(el(`<p class="puntaje">${aciertos}<span style="color:#8c8c96">/3</span></p>`),el('<h2 class="center">Probá con <em>otros casos.</em></h2>'),el('<p class="center">Necesitás resolver los tres. En la próxima partida cambian los casos.</p>'));
    const resumen=el('<ul class="resumen-casos"></ul>');
    partida.casos.forEach((c,i)=>resumen.append(el(`<li>${partida.respuestas[i].acierto?'✓':'✕'} <strong>${esc(c.lugar)}</strong><br>${c.correctas.map(id=>esc(CATALOGO[id].nombre)).join(' + ')}</li>`)));
    const otra=el('<button class="btn btn-red" type="button">Probar otros casos</button>');otra.onclick=()=>{nuevaPartida();ir('desafio');};
    s.append(resumen,otra,fuentesDesafio());
  },

  final(s) {
    const p = producto;
    s.append(
      el(`<div class="check"><svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></svg></div>`),
      el('<h2 class="center">3 de 3.<br><em>¡Desafío resuelto!</em></h2>'),
      el('<div class="participacion"><p>Ahora acercate al</p><strong>STAND 145A</strong><p>Mostrale esta pantalla al equipo para registrar tu participación en el sorteo presencial por obsequios.</p><p class="muted">Responder bien no garantiza un premio. Esta web no registra participantes ni realiza el sorteo. Consultá al equipo la dinámica y el horario.</p></div>'),
      el(`<div class="foto final-foto"><img src="${p.fotos.frente.src}" alt="${esc(p.fotos.frente.alt)}"></div>`),
      el(`<div class="tags">${p.usos.map(u => `<span class="tag">${esc(u)}</span>`).join('')}</div>`),
      el('<p class="muted">Uso industrial. Consultá las instrucciones y precauciones del envase.</p>')
    );
    const cont = el(`<div class="contacto"><h3>¿Querés saber más?</h3></div>`);
    const w = CONTACTO.whatsapp;
    if (w && w.numero) {
      const msg = encodeURIComponent(w.mensaje.replace('{producto}', p.nombre + ' ' + p.linea));
      cont.appendChild(el(`<a class="btn btn-wa" href="https://wa.me/${w.numero}?text=${msg}" target="_blank" rel="noopener">${ICONOS.wa}Escribinos por WhatsApp</a>`));
    }
    const redes = linksContacto(p);
    if (redes.length) cont.appendChild(el(`<div class="redes">${redes.map(r => `<a href="${r.h}" target="_blank" rel="noopener">${r.i}<span>${r.t}</span></a>`).join('')}</div>`));
    const again = el(`<button class="btn btn-ghost" type="button">Jugar de nuevo</button>`);
    again.onclick = () => { pararConfeti(); nuevaPartida(); ir('desafio'); };
    s.append(cont,fuentesDesafio(), el('<div class="spacer"></div>'), again);
  }
};

function fuentesDesafio(){
  return el(`<details class="fuentes"><summary>Productos y fichas oficiales</summary><p>Selección de productos, no instrucciones de aplicación. Consultá etiqueta, ficha y compatibilidad del equipo.</p><ul>${Object.values(CATALOGO).filter(p=>p.fuente).map(p=>`<li><a href="${p.fuente}" target="_blank" rel="noopener">${esc(p.nombre)}</a></li>`).join('')}</ul><p>Espuma HVAC-R: etiqueta del envase proporcionada por Refrioil.</p></details>`);
}

/* ===================== Confeti ===================== */
const cv = document.getElementById('confeti'), ctx = cv.getContext('2d');
let piezas = [], raf = null, fin = 0;
function confeti() {
  if (reducirMovimiento() || !ctx) return;
  cv.hidden = false; cv.width = innerWidth; cv.height = innerHeight; fin = performance.now() + 2600;
  const colores = ['#e30613', '#ffffff', '#9a9aa1', '#ff4d5c'];
  piezas = Array.from({ length: 140 }, () => ({ x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * .5, w: 6 + Math.random() * 8, h: 8 + Math.random() * 10, c: colores[Math.random() * colores.length | 0], vy: 2 + Math.random() * 3.5, vx: -1.5 + Math.random() * 3, r: Math.random() * Math.PI, vr: -.15 + Math.random() * .3 }));
  cancelAnimationFrame(raf); raf = requestAnimationFrame(tick);
}
function tick(t) {
  ctx.clearRect(0, 0, cv.width, cv.height);
  piezas.forEach(q => { q.x += q.vx; q.y += q.vy; q.r += q.vr; ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.r); ctx.fillStyle = q.c; ctx.fillRect(-q.w / 2, -q.h / 2, q.w, q.h); ctx.restore(); });
  if (t < fin) raf = requestAnimationFrame(tick); else pararConfeti();
}
function pararConfeti() { cancelAnimationFrame(raf); if (ctx) ctx.clearRect(0, 0, cv.width, cv.height); cv.hidden = true; }

/* Arranque (?pantalla=producto lo usa experiencia.html) */
const inicial = new URLSearchParams(location.search).get('pantalla');
ir(ORDEN.includes(inicial) ? inicial : 'inicio');
[producto.fotos.dorso.src, ...Object.values(CATALOGO).map(p=>p.img)].forEach(src => { new Image().src = src; });
</script>
